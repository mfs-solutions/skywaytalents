name: AWS Amplify Deployment

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
      
      - name: 📦 Install dependencies
        run: npm ci
      
      - name: 🏗️  Build application
        run: npm run build
      
      - name: 📊 Build size check
        run: |
          echo "Build artifacts:"
          du -sh dist/
          ls -lh dist/
      
      - name: ✅ Build verification
        if: success()
        run: echo "✅ Build successful - Ready for deployment"
      
      - name: 📤 Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-dist
          path: dist/
          retention-days: 30

  deploy-amplify:
    needs: build-and-deploy
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    permissions:
      contents: read
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
      
      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
      
      - name: 📦 Install dependencies
        run: npm ci
      
      - name: 📦 Install Amplify CLI
        run: npm install -g @aws-amplify/cli
      
      - name: 🏗️  Build application
        run: npm run build
      
      - name: 🚀 Deploy to AWS Amplify
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: us-east-1
        run: |
          amplify pull --accept-all --allow-destructive-operations --codegen 'false' || true
          amplify publish --yes --invalidateCache
      
      - name: ✅ Deployment complete
        if: success()
        run: echo "✅ Deployment to AWS Amplify successful!"
      
      - name: 💬 Comment deployment status
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '✅ Build successful and ready for deployment to AWS Amplify!'
            })

  notify-deployment:
    runs-on: ubuntu-latest
    needs: [build-and-deploy]
    if: always()
    
    steps:
      - name: 📬 Send notification
        if: always()
        run: |
          echo "Build Status: ${{ needs.build-and-deploy.result }}"
          echo "Deployment workflow completed"
